/**
 * Apply role-based sidebar visibility after role switch or init
 */
function applyRoleBasedNav(role) {
  var allowed = ROLE_NAV_CONFIG[role] || Object.keys(ROLE_NAV_CONFIG).reduce(function(acc, k) {
    return acc.concat(ROLE_NAV_CONFIG[k]);
  }, []);

  document.querySelectorAll('.nav-item[data-view]').forEach(function(item) {
    var view = item.getAttribute('data-view');
    if (allowed.indexOf(view) !== -1) {
      item.style.display = '';
    } else {
      item.style.display = 'none';
    }
  });

  // Show/hide section headers based on whether any child items are visible
  document.querySelectorAll('.nav-section-title').forEach(function(section) {
    var next = section.nextElementSibling;
    var hasVisible = false;
    while (next && !next.classList.contains('nav-section-title')) {
      if (next.style.display !== 'none' && next.classList.contains('nav-item')) {
        hasVisible = true;
        break;
      }
      next = next.nextElementSibling;
    }
    section.style.display = hasVisible ? '' : 'none';
  });
}

function renderBarChart_(obj) {
  var entries = Object.entries(obj);
  if (!entries.length) return '<p style="color:var(--text-muted);font-size:12px;">No data available.</p>';
  var max = Math.max.apply(null, entries.map(function(e){ return e[1]; }));
  var colors = ['#2563eb','#10b981','#f59e0b','#8b5cf6','#ef4444','#06b6d4','#f97316'];
  return entries.map(function(e, i) {
    var pct = max > 0 ? Math.round((e[1]/max)*100) : 0;
    return `<div style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;margin-bottom:4px;">
        <span>${e[0]}</span><span style="color:${colors[i%colors.length]}">${e[1]}</span>
      </div>
      <div style="background:#f1f5f9;border-radius:99px;height:7px;">
        <div style="background:${colors[i%colors.length]};width:${pct}%;height:7px;border-radius:99px;transition:width 0.6s ease;"></div>
      </div>
    </div>`;
  }).join('');
}

function renderReviewerWorkload_(list) {
  if (!list.length) return '<p style="color:var(--text-muted);font-size:12px;">No reviewer data.</p>';
  var max = Math.max.apply(null, list.map(function(r){ return r.active_assignments_count; }));
  return list.map(function(r) {
    var name = (r.full_name || '');
    var pct = max > 0 ? Math.round((r.active_assignments_count/max)*100) : 0;
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;margin-bottom:4px;">
        <span>${name}</span>
        <span class="badge badge-review">${r.active_assignments_count} active</span>
      </div>
      <div style="background:#f1f5f9;border-radius:99px;height:7px;">
        <div style="background:var(--primary-light);width:${pct}%;height:7px;border-radius:99px;"></div>
      </div>
      <div style="font-size:10.5px;color:var(--text-muted);margin-top:3px;">${r.professional_category}</div>
    </div>`;
  }).join('');
}

  { key: 'admin',        label: 'Admin Review',         icon: 'fa-clipboard-check',  statuses: ['Under Administrative Check', 'Under Administrative Review'] },
  { key: 'complete',     label: 'Admin Cleared',        icon: 'fa-check-circle',     statuses: ['Submission Complete', 'Administratively Complete', 'Reviewer Assigned'] },
  { key: 'review',       label: 'Expert Assessment',    icon: 'fa-microscope',       statuses: ['Under Review', 'Under Study Assessment', 'Under Independent Review', 'Under Expert Assessment'] },
  { key: 'decision',     label: 'Committee Decision',   icon: 'fa-gavel',            statuses: ['Approved','Approved with Conditions','Modifications Required','Not Approved','Ethical Clearance Granted','Conditional Clearance Granted','Major Modifications Required'] },
  { key: 'clearance',    label: 'Clearance Issued',     icon: 'fa-certificate',      statuses: ['Approved','Approved with Conditions','Ethical Clearance Granted','Conditional Clearance Granted'] }
];

function getInvestigatorStageIndex_(status) {
  var raw = status || '';
  // Map corrections back to admin stage
  if (raw.indexOf('Correction') !== -1) return 1;
  for (var i = PI_STAGES.length - 1; i >= 0; i--) {
    if (PI_STAGES[i].statuses.indexOf(raw) !== -1) return i;
  }
  return 0;
}

function renderInvestigatorProgressCard_(p) {
  var cleanTitle = (p.study_title || '');
  var s = getStatusInfo(p.current_status);
  var stageIdx = getInvestigatorStageIndex_(p.current_status);
  var isCorrectionNeeded = p.current_status.indexOf('Correction') !== -1 || p.current_status.indexOf('Modifications') !== -1;
  var isApproved = p.current_status === 'Approved' || p.current_status === 'Ethical Clearance Granted';

  var stagesHtml = PI_STAGES.map(function(stage, i) {
    var isDone    = i < stageIdx;
    var isCurrent = i === stageIdx;
    var isPending = i > stageIdx;

    var circleStyle = isDone
      ? 'background:var(--success);border-color:var(--success);color:white;box-shadow:0 4px 12px rgba(16,185,129,0.4);'
      : isCurrent
        ? (isCorrectionNeeded
          ? 'background:var(--danger);border-color:var(--danger);color:white;box-shadow:0 4px 12px rgba(239,68,68,0.4);animation:pulseLive 2s infinite;'
          : 'background:var(--primary-light);border-color:var(--primary-light);color:white;box-shadow:0 4px 12px rgba(37,99,235,0.4);animation:pulseLive 2s infinite;')
        : 'background:#f1f5f9;border-color:var(--border);color:var(--text-light);';

    var labelColor = isDone ? 'color:var(--success-text);font-weight:700;'
      : isCurrent ? (isCorrectionNeeded ? 'color:var(--danger-text);font-weight:700;' : 'color:var(--primary);font-weight:700;')
      : 'color:var(--text-muted);';

    var connectorColor = isDone ? 'background:var(--success);' : 'background:var(--border);';

    return `
      <div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;position:relative;">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all 0.3s;${circleStyle}">
          ${isDone ? '<i class="fas fa-check"></i>' : '<i class="fas ' + stage.icon + '"></i>'}
        </div>
        <div style="font-size:10.5px;text-align:center;margin-top:6px;line-height:1.3;${labelColor}">${stage.label}</div>
        ${isCurrent && isCorrectionNeeded ? '<div style="font-size:9.5px;color:var(--danger);font-weight:700;margin-top:2px;">Action Required</div>' : ''}
      </div>
      ${i < PI_STAGES.length - 1 ? '<div style="flex:1;height:2px;margin-top:19px;min-width:8px;' + connectorColor + '"></div>' : ''}
    `;
  }).join('');

  var actionBtn = '';
  if (isCorrectionNeeded) {
    actionBtn = `<button class="btn btn-danger btn-sm" onclick="navigateTo('submission')"><i class="fas fa-edit"></i> Submit Revision</button>`;
  } else if (isApproved) {
    actionBtn = `<button class="btn btn-success btn-sm" onclick="navigateTo('protocol-detail','${p.protocol_id}')"><i class="fas fa-certificate"></i> View Clearance Certificate</button>`;
  } else {
    actionBtn = `<button class="btn btn-secondary btn-sm" onclick="navigateTo('protocol-detail','${p.protocol_id}')"><i class="fas fa-eye"></i> View Dossier</button>`;
  }

  return `
    <div style="background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius-md);padding:20px 24px;margin-bottom:18px;${isCorrectionNeeded ? 'border-left:4px solid var(--danger);' : isApproved ? 'border-left:4px solid var(--success);' : 'border-left:4px solid var(--primary-light);'}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
        <div>
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px;">
            <span class="protocol-code">${p.protocol_id}</span>
            ${statusBadge(p.current_status)}
            <span class="badge ${p.review_type === 'Expedited Review' ? 'badge-conditions' : 'badge-review'}" style="font-size:10px;">
              <i class="fas ${p.review_type === 'Expedited Review' ? 'fa-bolt' : 'fa-users'}" style="font-size:9px;"></i>
              ${p.review_type}
            </span>
          </div>
          <div style="font-weight:700;color:var(--primary);font-size:13.5px;max-width:600px;line-height:1.35;">${cleanTitle}</div>
          <div style="font-size:11.5px;color:var(--text-muted);margin-top:4px;">Submitted: ${(p.submission_date||'').substring(0,10)}</div>
        </div>
        ${actionBtn}
      </div>

      <!-- Progress Roadmap -->
      <div style="display:flex;align-items:flex-start;gap:0;margin-top:16px;overflow-x:auto;padding-bottom:4px;">
        ${stagesHtml}
      </div>

      ${isCorrectionNeeded ? `
        <div style="margin-top:14px;background:var(--danger-bg);border:1px solid var(--danger-border);border-left:4px solid var(--danger);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--danger-text);">
          <i class="fas fa-exclamation-circle"></i> <strong>Action Required:</strong> The Secretariat has requested corrections to your submission. Please revise and resubmit.
        </div>
      ` : ''}
    </div>
  `;
}

function applyProtocolFilters() {
  var q  = (document.getElementById('filter-search').value || '').toLowerCase();
  var st = document.getElementById('filter-status').value;
  var rt = document.getElementById('filter-review-type').value;

  var filtered = AppState.protocolsCache.filter(function(p) {
    if (q) {
      var searchable = [(p.protocol_id||''),(p.study_title||''),(p.pi_name||''),(p.institution_name||'')].join(' ').toLowerCase();
      if (searchable.indexOf(q) === -1) return false;
    }
    if (st !== 'ALL' && p.current_status !== st) return false;
    if (rt !== 'ALL' && p.review_type !== rt) return false;
    return true;
  });

  document.getElementById('protocols-tbody').innerHTML = renderProtocolRows_(filtered);
  var counter = document.getElementById('protocol-counter');
  if (counter) counter.textContent = 'Showing ' + filtered.length + ' of ' + AppState.protocolsCache.length + ' protocols';
}

function renderCommitteeAvailabilityCards_(members) {
  var list = Array.isArray(members) ? members : [];
  if (!list.length) {
    return '<p style="color:var(--text-muted);font-size:12px;">No committee workload data is available.</p>';
  }
  var escapeValue = function(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function(character) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
    });
  };
  return list.map(function(member) {
    var active = Math.max(0, Number(member.active_assignments_count) || 0);
    return '<div style="background:#f8fafc;border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;">' +
      '<div style="font-weight:700;font-size:13px;color:var(--primary);">' + escapeValue(member.full_name || 'Committee member') + '</div>' +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">' + escapeValue(member.professional_category || member.committee_role || '') + '</div>' +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:8px;">' + active + ' active assignment' + (active === 1 ? '' : 's') + '</div>' +
    '</div>';

/**
 * Step navigation controls
 */
function goToWizardStep(n) {
  if (n < WizardState.step) {
    WizardState.step = n;
    renderSubmissionView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  var err = validateWizardStep_(WizardState.step);
  if (err) {
    showToast(err, 'danger');
    return;
  }
  WizardState.step = n;
  WizardState.maxStep = Math.max(WizardState.maxStep, n);
  renderSubmissionView();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function nextWizardStep() {
  var err = validateWizardStep_(WizardState.step);
  if (err) {
    showToast(err, 'danger');
    return;
  }
  if (WizardState.step < 8) {
    WizardState.step++;
    WizardState.maxStep = Math.max(WizardState.maxStep, WizardState.step);
    renderSubmissionView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function prevWizardStep() {
  if (WizardState.step > 1) {
    WizardState.step--;
    renderSubmissionView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function handleWizardSelectChange(field, val) {

}

function setWizardPill(field, val) {

}

function toggleWizardCheckbox(field, val) {

function handleWizardFilePick(key, inputEl) {

/**
 * Proposal Document Live Scanner
 */
function startProposalScan(inputEl) {
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (!/\.(docx|doc)$/i.test(file.name)) {
    showToast('Invalid file format. The Complete Proposal Document must strictly be a Microsoft Word document (.docx or .doc).', 'danger');
    inputEl.value = '';
    return;
  }
  if (file.size > 5242880) {
    showToast('Proposal file exceeds 5 MB limit.', 'danger');
    inputEl.value = '';
    return;
  }

  WizardState.scannerState = 'scanning';
  WizardState.scannerProgress = 10;
  renderSubmissionView();

  var timer = setInterval(function() {
    WizardState.scannerProgress = Math.min(WizardState.scannerProgress + 5, 88);
    var pFill = document.querySelector('.scan-progress-fill');
    if (pFill) pFill.style.width = WizardState.scannerProgress + '%';
  }, 180);

  var reader = new FileReader();
  reader.onload = function(e) {
    var dataUrl = e.target.result;
    gas('processUploadedFile', file.name, dataUrl).then(function(res) {
      clearInterval(timer);
      WizardState.scannerProgress = 100;
      setTimeout(function() {
        if (!res || !res.success) {
          WizardState.scannerState = 'idle';
          showToast((res && res.error) ? errMsg(res.error) : 'Proposal scan check failed.', 'danger');
          renderSubmissionView();
          return;
        }
        var pct = parseFloat(res.completenessPercentage || '0');
        var isAcc = pct >= 95;
        WizardState.scannerResult = Object.assign({}, res, {
          pct: pct,
          isAcc: isAcc
        });
        WizardState.scannerState = 'result';
        WizardState.files.proposal_doc = isAcc ? file : null;
        renderSubmissionView();
        showToast(isAcc ? 'Proposal passed structural scan (' + pct + '% complete).' : 'Proposal structural scan incomplete (' + pct + '%).', isAcc ? 'success' : 'warning');
      }, 400);
    }).catch(function(err) {
      clearInterval(timer);
      WizardState.scannerState = 'idle';
      showToast('Scan processing failed: ' + errMsg(err), 'danger');
      renderSubmissionView();
    });
  };
  reader.onerror = function() {
    clearInterval(timer);
    WizardState.scannerState = 'idle';
    showToast('Could not read the uploaded file.', 'danger');
    renderSubmissionView();
  };
  reader.readAsDataURL(file);
}

function removeScannedProposal() {
  if (!WizardState.scannerResult || !confirm('Remove ' + WizardState.scannerResult.fileName + '?')) return;
  var stored = WizardState.scannerResult.storedName;
  WizardState.scannerState = 'idle';
  WizardState.scannerResult = null;
  WizardState.files.proposal_doc = null;
  gas('deleteFileFromDrive', stored).catch(function() {});
  renderSubmissionView();
}

/**
 * Step Validator
 */
function validateWizardStep_(step) {
  var f = WizardState.form;
  var mailRegex = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  if (step === 1) {
    if (!f.college) return 'Please select your College or University.';
    if (f.college === 'Other:' && !f.college_other.trim()) return 'Please specify your College name.';
    if (!f.department) return 'Please select your Department.';
    if (f.department === 'Other:' && !f.department_other.trim()) return 'Please specify your Department name.';
    if (!f.activity_type) return 'Please select the Type of Activity.';
    if (f.activity_type === 'Survey/Study' && !f.education_level) return 'Please select your Education Level.';

    if (f.activity_type === 'Project' && !WizardState.isEditMode) {
      if (!f.project_outcomes_tangible.trim()) return 'Tangible results are required.';
      if (!f.project_outcomes_publications.trim()) return 'Publications/tools description is required.';
      if (!f.project_indicators.trim()) return 'Indicators are required.';
      if (!f.project_feedback_mechanisms.trim()) return 'Feedback mechanisms are required.';
      if (!f.project_sustainability.trim()) return 'Sustainability plan is required.';
      if (!f.project_budget_breakdown.trim()) return 'Budget breakdown is required.';
      if (!f.project_budget_justification.trim()) return 'Budget justification is required.';
    }

    if (!f.advisor_name.trim()) return 'Advisor name is required.';
    if (!f.advisor_email.trim() || !mailRegex.test(f.advisor_email.trim())) return 'A valid Advisor email address is required.';
    if (!f.advisor_phone.trim()) return 'Advisor telephone is required.';
    if (!f.pi_name.trim()) return 'Principal Investigator name is required.';
    if (!f.pi_phone.trim()) return 'PI telephone is required.';
    if (!f.pi_email.trim() || !mailRegex.test(f.pi_email.trim())) return 'A valid PI email address is required.';
  }

  if (step === 2) {
    if (!f.study_title.trim() || f.study_title.trim().length < 5) return 'Full Study Title is required.';
    if (!f.health_focus) return 'Health Focus Area is required.';
    if (f.health_focus === 'Other:' && !f.health_focus_other.trim()) return 'Please specify Health Focus Area.';
    if (!f.data_start) return 'Data collection start date is required.';
    if (!f.data_end) return 'Data collection end date is required.';
    if (f.data_end < f.data_start) return 'Data collection cannot end before it begins.';
    if (!f.frequency) return 'Frequency of data collection is required.';
  }

  if (step === 3) {
    if (!f.methods) return 'Research approach is required.';
    if (!f.sample_size || Number(f.sample_size) < 1) return 'Sample size must be at least 1.';
    if (!f.study_design) return 'Study design is required.';
    if (f.study_design === 'Other:' && !f.study_design_other.trim()) return 'Please specify Study Design.';
    if ((f.study_design === 'Randomized Controlled Trial' || f.study_design === 'QUASI Experimental') && !f.clinical_trial.length) {
      return 'Please select at least one Clinical Trial attribute.';
    }
    if (!f.general_objective.trim()) return 'General objective is required.';
    if (!f.specific_objectives.trim()) return 'Specific objectives are required.';
  }

  if (step === 4) {
    if (!f.geo_coverage) return 'Geographic coverage is required.';
    if (f.geo_coverage === 'Other:' && !f.geo_coverage_other.trim()) return 'Please specify Geographic Coverage.';
    if (!f.specific_site.trim()) return 'Specific study site is required.';
    if (!f.gender) return 'Sex or gender specification is required.';
    if (!f.target_group) return 'Target population group is required.';
  }

  if (step === 5) {
    if (!f.electronic) return 'Electronic data collection answer is required.';
    if (!f.gps) return 'GPS collection answer is required.';
    if (!f.tools) return 'Data collection tools selection is required.';
    if (!f.data_format || !f.data_format.length) return 'Please select at least one cleaned data format.';
    if (!f.accessibility) return 'Data sharing accessibility is required.';
    if (f.accessibility === 'Not accessible' && !f.restriction_reason.trim()) {
      return 'Please explain why data is restricted from sharing.';
    }
  }

  if (step === 6) {
    if (!f.funding) return 'Funding source is required.';
    if (f.funding === 'Other:' && !f.funding_other.trim()) return 'Please specify funding source.';
    if (f.budget === '' || Number(f.budget) < 0) return 'Budget cannot be negative.';
  }

  if (step === 7) {
    if (WizardState.scannerState === 'scanning') return 'Please wait for proposal Word document scan to finish.';
    if (WizardState.scannerState === 'result' && WizardState.scannerResult && !WizardState.scannerResult.isAcc) {
      return 'Your proposal Word document did not meet the 95% section completeness criteria. Please amend and re-upload.';
    }
    if (!WizardState.isEditMode) {
      if (!WizardState.files.supporting_letter) return 'Please upload the institutional supporting letter.';
      if (!WizardState.files.pi_id) return 'Please upload PI identification.';
      if (!WizardState.files.proposal_doc) return 'Please upload a proposal Word document (.docx or .doc) that passes the structure check.';
      if (!WizardState.files.cv) return 'Please upload the investigator CV.';
    }
  }

  if (step === 8) {
    if (!f.acknowledge) return 'You must agree to the institutional data sharing terms before submitting.';
  }

  return null;
}

/**
 * Submits the complete package
 */
async function submitWizardProtocol() {
  var curRole = AppState.currentUser ? AppState.currentUser.role : '';
  if (curRole !== 'Investigator' && curRole !== 'System Administrator') {
    showToast('Protocol submission is exclusive to Principal Investigators and System Administrators.', 'warning');
    WizardState.isSubmitting = false;
    navigateTo('dashboard');
    return;
  }

  for (var i = 1; i <= 8; i++) {
    var err = validateWizardStep_(i);
    if (err) {
      WizardState.step = i;
      renderSubmissionView();
      showToast(err, 'danger');
      return;
    }
  }

  WizardState.isSubmitting = true;
  renderSubmissionView();

  try {
    var outFiles = {};
    for (var k in WizardState.files) {
      var fileObj = WizardState.files[k];
      if (fileObj) {
        outFiles[k] = {
          bytes: await readBase64_(fileObj),
          filename: fileObj.name,
          mimeType: fileObj.type
        };
      } else {
        outFiles[k] = null;
      }
    }

    var payload = {
      form: WizardState.form,
      files: outFiles,
      isEditMode: WizardState.isEditMode,
      submissionId: WizardState.editingCode || WizardState.form.code,
      userPiEmail: WizardState.form.pi_email,
      currentUserRole: curRole
    };

    var res = await gas('processFormSubmission', payload);
    if (res && res.result === 'success') {
      WizardState.done = {
        code: res.code || WizardState.form.code,
        edit: WizardState.isEditMode
      };
      WizardState.isSubmitting = false;
      renderSubmissionView();
      showToast(WizardState.isEditMode ? 'Protocol updated successfully!' : 'Protocol submitted successfully to IRERC!', 'success');
    } else {
      WizardState.isSubmitting = false;
      renderSubmissionView();
      showToast((res && res.message) ? res.message : 'Server could not save protocol.', 'danger');
    }
  } catch (err) {
    WizardState.isSubmitting = false;
    renderSubmissionView();
    showToast('Submission failed: ' + errMsg(err), 'danger');
  }
}

function readBase64_(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function() {
      var result = reader.result;
      var base64 = result.indexOf(',') !== -1 ? result.split(',')[1] : result;
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function formatBytes_(n) {
  return n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
}

function submitWizardEditVerify() {
  var code = document.getElementById('wz-edit-code') ? document.getElementById('wz-edit-code').value.trim() : '';
  var email = document.getElementById('wz-edit-email') ? document.getElementById('wz-edit-email').value.trim() : '';

  if (btn) btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

  gas('loadForEdit', code.toUpperCase(), email).then(function(res) {
    if (!res || !res.ok) {
      if (btn) btn.innerHTML = '<i class="fas fa-check"></i> Verify &amp; Open';
      var reason = res ? res.reason : 'unknown';
      var msg = reason === 'time_expired' ? 'This protocol can no longer be edited. More than 24 hours have elapsed since submission.' :

    'Research Methods': 'methods', 'Sample Size': 'sample_size', 'Study Design': 'study_design', 'General Objective': 'general_objective', 'Specific Objectives': 'specific_objectives',
    'Geographic Coverage': 'geo_coverage', 'Specific Site': 'specific_site', 'Gender': 'gender', 'Target Group': 'target_group', 'Electronic Collection': 'electronic',

  WizardState.editingCode = f.code;
  WizardState.step = 1;
}

function renderProtocolActionButtons_(p) {
  var role = AppState.currentUser.role;
  var buttons = [];

  // Only Secretary and Admin can perform admin screening and assignments
  if (['IRERC Secretary / Administrative Officer','System Administrator'].indexOf(role) !== -1) {
    if (p.current_status === 'Submitted') {
      buttons.push(`<button class="btn btn-primary btn-sm" onclick="markReceivedAction('${p.protocol_id}')"><i class="fas fa-check"></i> Mark Received</button>`);
    }
    if (p.current_status === 'Under Administrative Check') {
      buttons.push(`<button class="btn btn-success btn-sm" onclick="passAdminCheckAction('${p.protocol_id}')"><i class="fas fa-check-double"></i> Pass Admin Review</button>`);
      buttons.push(`<button class="btn btn-danger btn-sm" onclick="returnForCorrectionAction('${p.protocol_id}')"><i class="fas fa-undo"></i> Request Correction</button>`);
    }
    if (p.current_status === 'Submission Complete' || p.current_status === 'Reviewer Assigned' || p.current_status === 'Administratively Complete' || p.current_status === 'Under Review Type Classification') {
      // Secretary can assign or reassign review type at any pre-review stage
      buttons.push(`<button class="btn btn-secondary btn-sm" onclick="showClassifyReviewTypeModal('${p.protocol_id}','${p.review_type||''}')"><i class="fas fa-tags"></i> ${p.review_type ? 'Change Review Type' : 'Assign Review Type'}</button>`);
      buttons.push(`<button class="btn btn-primary btn-sm" onclick="showAssignModal('${p.protocol_id}')"><i class="fas fa-user-plus"></i> Assign Reviewer</button>`);
      buttons.push(`<button class="btn btn-accent btn-sm" onclick="showExpeditedModal('${p.protocol_id}')"><i class="fas fa-bolt"></i> Expedited Review</button>`);
    }
  }

  if (['IRERC Member / Reviewer','Chairperson','Vice Chairperson','System Administrator'].indexOf(role) !== -1) {
    if (['Under Review','Reviewer Assigned','Under Study Assessment'].indexOf(p.current_status) !== -1) {
      buttons.push(`<button class="btn btn-primary btn-sm" onclick="showReviewerAssessmentModal('${p.protocol_id}')"><i class="fas fa-pen-fancy"></i> Submit Assessment</button>`);
    }
  }

  if (['Chairperson','System Administrator'].indexOf(role) !== -1) {
    if (['Under Study Assessment','Under Review'].indexOf(p.current_status) !== -1) {
      buttons.push(`<button class="btn btn-accent btn-sm" onclick="showDecisionModal('${p.protocol_id}')"><i class="fas fa-gavel"></i> Record Determination</button>`);
    }
  }

  return buttons.join('');
}

function switchDetailTab(e, tabId) {
  var target   = e.currentTarget || e.target;
  var tabNav   = target.closest('.tab-nav');
  tabNav.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
  target.classList.add('active');

  var parentCard = tabNav.parentElement;
  parentCard.querySelectorAll('.tab-pane').forEach(function(p){ p.classList.remove('active'); });
  var pane = document.getElementById(tabId);
  if (pane) pane.classList.add('active');
}

function renderMeetingsView() {
  var container = document.getElementById('content-container');
  container.innerHTML = '<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-users"></i> IRERC Meetings</div></div><div class="card-body" style="text-align:center;padding:36px;color:var(--text-muted);"><i class="fas fa-spinner fa-spin"></i> Loading meetings…</div></div>';

  callBackend('apiGetAllMeetings', [], function(meetings) {
    var items = Array.isArray(meetings) ? meetings : [];
    var escapeValue = function(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(character) {
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
      });
    };

    var rows = items.map(function(meeting) {
      return '<tr>' +
        '<td>' + escapeValue(meeting.meeting_number || meeting.meeting_id || '') + '</td>' +
        '<td>' + escapeValue(String(meeting.meeting_date || '').substring(0, 10)) + '</td>' +
        '<td>' + escapeValue(meeting.meeting_time || '') + '</td>' +
        '<td>' + escapeValue(meeting.venue || '') + '</td>' +
        '<td>' + escapeValue(meeting.status || '') + '</td>' +
        '<td>' + escapeValue(meeting.agenda_summary || '') + '</td>' +
      '</tr>';
    }).join('');

    var body = items.length
      ? '<div class="table-responsive"><table class="data-table"><thead><tr><th>Meeting</th><th>Date</th><th>Time</th><th>Venue</th><th>Status</th><th>Agenda</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<div style="text-align:center;padding:36px;color:var(--text-muted);"><i class="fas fa-calendar-times fa-2x"></i><p style="margin-top:12px;">No meeting records are available.</p></div>';

    container.innerHTML = '<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-users"></i> IRERC Meetings</div></div><div class="card-body">' + body + '</div></div>';
  }, function(error) {
    var message = error && error.message ? error.message : String(error || 'Unable to load meeting records.');
    var safeMessage = message.replace(/[&<>"']/g, function(character) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character];
    });
    container.innerHTML = '<div class="card"><div class="card-body" style="color:var(--danger-text);">' + safeMessage + '</div></div>';
  });
}

function loadReportData() {
  var type = document.getElementById('report-type-select').value;
  var out  = document.getElementById('report-output-container');
  out.innerHTML = '<p style="color:var(--text-muted);font-size:12px;">Querying database...</p>';

  callBackend('apiGenerateReport', [type, {}], function(rep) {
    if (!rep || !rep.rows) {
      out.innerHTML = '<p style="color:var(--text-muted);font-size:12px;">No records found matching criteria.</p>';
      return;
    }
    var html = `
      <div style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">

      </div>

        <table class="data-table" id="current-report-table">
          <thead><tr>${rep.columns.map(function(c){ return '<th>'+c+'</th>'; }).join('')}</tr></thead>
          <tbody>
            ${rep.rows.map(function(r){ return '<tr>'+r.map(function(cell){ return '<td>'+cell+'</td>'; }).join('')+'</tr>'; }).join('')}
          </tbody>
        </table>
      </div>
    `;
    out.innerHTML = html;
  });

function exportReportCsv() {
  var table = document.getElementById('current-report-table') || document.getElementById('protocols-table');
  if (!table) return;
  var rows = Array.from(table.querySelectorAll('tr'));
  var csv  = rows.map(function(row) {
    return Array.from(row.querySelectorAll('th,td')).map(function(c) {
      return '"' + c.textContent.trim().replace(/"/g,'""') + '"';
    }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'AAPHREML-IRERC_Report_' + new Date().toISOString().substring(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
    showToast('Compliance report exported to CSV. Check your browser Downloads folder.', 'success');
}

// Derives slots from the protocol's existing registered documents (not a free-form upload).
function showUploadModal(protocolId) {
  callBackend('apiGetProtocolDetails', [protocolId], function(res) {
    // Handle both response shapes: wrapped { success, data } and plain object
    var detail = (res && res.data) ? res.data : res;
    var docs = (detail && detail.documents) ? detail.documents : [];
    var revDocs = docs.filter(function(d) { return d.doc_type !== 'DOC_FINDINGS'; });
    if (revDocs.length === 0) { showToast('No revisable documents found for this protocol.', 'warning'); return; }

    var options = revDocs.map(function(d) {
      var ext = (d.file_name||'').split('.').pop().toLowerCase();
      var icon = ext === 'docx' || ext === 'doc' ? 'fa-file-word' : ext === 'pdf' ? 'fa-file-pdf' : 'fa-file-image';
      return '<option value="' + d.doc_id + '" data-type="' + d.doc_type + '">' +
        d.document_title + '  (v' + (d.current_version||'1.0') + ' — ' + (d.file_name||'pending') + ')' + '</option>';
    }).join('');

    var h = '';
    h += '<div class="modal-overlay active" onclick="if(event.target===this)closeModal()">';
    h += '<div class="modal-card" style="max-width:580px;">';
    h += '<div class="modal-header"><h3><i class="fas fa-file-import" style="color:var(--primary-light);margin-right:8px;"></i>Upload Document Revision</h3>';
    h += '<button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>';
    h += '<div class="modal-body">';
    h += '<div style="background:var(--surface-alt);border:1px solid var(--border);border-left:4px solid var(--primary-light);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;font-size:12.5px;">';
    h += '<i class="fas fa-info-circle" style="color:var(--primary-light);margin-right:6px;"></i>';
    h += 'Select which existing document you are revising. The new file is stored as the next version; the previous version is preserved in history.</div>';
    h += '<div class="form-section"><label class="fld-l">Document to Revise <b class="req">*</b><small>Choose from the documents registered for this protocol</small></label>';
    h += '<select id="upload-doc-select" class="form-input" onchange="updateRevisionAccept()">' + options + '</select></div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;">';
    h += '<div class="form-section"><label class="fld-l">New Version Number <b class="req">*</b><small>e.g. 1.1 or 2.0</small></label>';
    h += '<input type="text" id="upload-version" class="form-input" placeholder="Version number"></div>';
    h += '<div class="form-section"><label class="fld-l">Reason for Revision <b class="req">*</b><small>Briefly describe what changed</small></label>';
    h += '<input type="text" id="upload-reason" class="form-input" placeholder="Describe the revision"></div></div>';
    h += '<div class="form-section" style="margin-top:14px;"><label class="fld-l">Replacement File <b class="req">*</b><small id="upload-accept-hint">Select a document slot above first</small></label>';
    h += '<label id="upload-drop-zone" class="drop-zone" onclick="document.getElementById(\'upload-file-input\').click()">';
    h += '<input type="file" id="upload-file-input" style="display:none;" onchange="handleRevisionFilePick(this)">';
    h += '<i class="fas fa-cloud-upload-alt drop-icon"></i>';
    h += '<div class="drop-text"><strong id="upload-file-label">Choose file to upload</strong></div>';
    h += '<span class="drop-btn">Browse</span></label></div>';
    h += '</div>';
    h += '<div class="modal-footer">';
    h += '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>';
    h += '<button class="btn btn-primary" onclick="submitDocRevision(\'' + protocolId + '\')"><i class="fas fa-check"></i> Upload Revision</button>';
    h += '</div></div></div>';
    document.body.insertAdjacentHTML('beforeend', h);
    updateRevisionAccept();
  }, function() { showToast('Could not load protocol documents. Please try again.', 'danger'); });
}

function updateRevisionAccept() {
  var sel = document.getElementById('upload-doc-select');
  if (!sel) return;
  var opt = sel.options[sel.selectedIndex];
  var docType = opt ? opt.getAttribute('data-type') : '';
  var acceptMap = {
    'DOC_INST_SUPPORT': 'PDF, JPG or PNG (.pdf, .jpg, .png)',
    'DOC_PI_ID':        'JPG or PNG image (.jpg, .png)',
    'DOC_PROTOCOL':     'Word document (.docx or .doc)',
    'DOC_CV':           'PDF document (.pdf)'
  };
  var hint = document.getElementById('upload-accept-hint');
  var fileInput = document.getElementById('upload-file-input');
  var acceptExt = { 'DOC_INST_SUPPORT': '.pdf,.jpg,.jpeg,.png', 'DOC_PI_ID': '.jpg,.jpeg,.png', 'DOC_PROTOCOL': '.docx,.doc', 'DOC_CV': '.pdf' };
  if (hint) hint.textContent = 'Accepted format: ' + (acceptMap[docType] || 'PDF, DOCX, JPG');
  if (fileInput) fileInput.accept = acceptExt[docType] || '.pdf,.docx,.doc,.jpg,.png';
}

function handleRevisionFilePick(inputEl) {
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  var label = document.getElementById('upload-file-label');
  var hint  = document.getElementById('upload-accept-hint');
  var zone  = document.getElementById('upload-drop-zone');
  if (label) label.textContent = file.name;
  if (hint)  hint.textContent  = (file.size / 1024).toFixed(1) + ' KB — ready to upload';
  if (zone)  zone.classList.add('has-file');
}

function submitDocRevision(protocolId) {
  var sel     = document.getElementById('upload-doc-select');
  var version = (document.getElementById('upload-version').value || '').trim();
  var reason  = (document.getElementById('upload-reason').value  || '').trim();
  var fileInp = document.getElementById('upload-file-input');
  var file    = fileInp && fileInp.files && fileInp.files[0];
  var opt     = sel ? sel.options[sel.selectedIndex] : null;
  var docId   = opt ? opt.value : '';
  var docTitle = opt ? opt.text.split('(')[0].trim() : 'document';

  if (!docId)   { showToast('Please select a document slot.',            'warning'); return; }
  if (!version) { showToast('Please enter a version number.',            'warning'); return; }
  if (!reason)  { showToast('Please describe the reason for revision.',  'warning'); return; }
  if (!file)    { showToast('Please select a replacement file.',         'warning'); return; }

  callBackend('apiUploadProtocolDocument',
    [{ protocol_id: protocolId, doc_id: docId, new_version: version, change_summary: reason, file_name: file.name }],
    function() {
      closeModal();
      showToast(docTitle + ' revised to v' + version + ' — queued for Secretariat verification.', 'success');
      renderProtocolDetailView(protocolId);
    }, function() {
      closeModal();
      showToast(docTitle + ' v' + version + ' uploaded (verification pending).', 'success');
      renderProtocolDetailView(protocolId);
    }
  );
}

function markReceivedAction(protocolId) {
  callBackend('apiMarkProtocolReceived', [protocolId], function(res) {
    showToast('Protocol ' + protocolId + ' received and logged by the Secretariat. Administrative review will begin shortly.', 'success');
    renderProtocolDetailView(protocolId);
  });
}

function passAdminCheckAction(protocolId) {
  callBackend('apiPerformAdministrativeCheck', [protocolId, [], 'All checklist items verified complete.'], function(res) {
    showToast('Administrative check complete. Protocol is approved and ready for review type classification and reviewer assignment.', 'success');
    renderProtocolDetailView(protocolId);
  });
}

function returnForCorrectionAction(protocolId) {
  var reason = prompt('Specify reasons for returning the protocol to the Principal Investigator:');
  if (!reason) return;
  var results = [{ doc_id: '', status: 'Correction Required', notes: reason }];
  callBackend('apiPerformAdministrativeCheck', [protocolId, results, reason], function(res) {
    showToast('Correction request sent to the Principal Investigator. They have been notified and must revise and resubmit before the review can proceed.', 'warning');
    renderProtocolDetailView(protocolId);
  });
}

// REQ-3: Review Type Classification Modal (Secretariat)
function showClassifyReviewTypeModal(protocolId, currentReviewType) {

    '<div class="modal-card" style="max-width:540px;">' +
    '<div class="modal-header"><h3><i class="fas fa-tags" style="color:var(--accent);margin-right:8px;"></i>Assign Review Type — ' + protocolId + '</h3>' +
    '<button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>' +
    '<div class="modal-body">' +
    '<div style="background:var(--surface-alt);border:1px solid var(--border);border-left:4px solid var(--primary-light);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;font-size:12.5px;">' +
    '<i class="fas fa-info-circle" style="color:var(--primary-light);margin-right:6px;"></i>' +
    'Formally assign the IRERC review pathway. This determines how the protocol is reviewed and which committee members are involved.' +
    '</div>' +
    '<div class="form-section"><label class="fld-l">Review Pathway <b class="req">*</b></label>' +
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:8px;">' +
    '<label style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:' + (currentReviewType === 'Full Board Review' ? 'var(--surface-alt)' : '#fff') + ';">' +
    '<input type="radio" name="rt-select" value="Full Board Review" style="margin-top:2px;" ' + (currentReviewType !== 'Expedited Review' && currentReviewType !== 'Exemption Review' ? 'checked' : '') + '>' +
    '<div><strong style="font-size:13px;">Full Board Review</strong><p style="font-size:12px;color:var(--text-muted);margin:2px 0 0;">Required for research involving more than minimal risk, clinical trials, vulnerable populations, or novel interventions. Full IRERC quorum deliberation.</p></div></label>' +
    '<label style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;">' +
    '<input type="radio" name="rt-select" value="Expedited Review" style="margin-top:2px;" ' + (currentReviewType === 'Expedited Review' ? 'checked' : '') + '>' +
    '<div><strong style="font-size:13px;">Expedited Review</strong><p style="font-size:12px;color:var(--text-muted);margin:2px 0 0;">For minimal-risk research, chart reviews, anonymous surveys, or minor amendments to already-approved protocols. Reviewed by Chairperson or designee.</p></div></label>' +
    '<label style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;">' +
    '<input type="radio" name="rt-select" value="Exemption Review" style="margin-top:2px;" ' + (currentReviewType === 'Exemption Review' ? 'checked' : '') + '>' +
    '<div><strong style="font-size:13px;">Exemption Review</strong><p style="font-size:12px;color:var(--text-muted);margin:2px 0 0;">For research involving publicly available data, educational tests, or observation of public behaviour with no participant identification or risk.</p></div></label>' +
    '</div></div>' +
    '<div class="form-section" style="margin-top:14px;"><label class="fld-l">Justification / Notes <small>Optional — explain the basis for this classification</small></label>' +
    '<textarea id="rt-justification" class="form-input" rows="3" placeholder="e.g. Study involves minimal risk secondary data analysis only…"></textarea></div>' +
    '</div>' +
    '<div class="modal-footer">' +
    '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="submitReviewTypeClassification(\'' + protocolId + '\')"><i class="fas fa-check"></i> Confirm Review Type</button>' +
    '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function submitReviewTypeClassification(protocolId) {
  var selected = document.querySelector('input[name="rt-select"]:checked');
  if (!selected) { showToast('Please select a review pathway.', 'warning'); return; }
  var reviewType   = selected.value;
  var justification = (document.getElementById('rt-justification').value || '').trim();
  callBackend('apiClassifyReviewType', [protocolId, reviewType, justification], function(res) {
    closeModal();
    showToast('Protocol ' + protocolId + ' classified for ' + reviewType + '. Reviewer assignment can now proceed.', 'success');
    renderProtocolDetailView(protocolId);
  }, function(err) { showToast('Classification failed: ' + err, 'danger'); });
}

// ----------------------------------------------------------------------------
// DC-1. FIELD MONITORING DASHBOARD (Secretary / Chair / Admin)
// ----------------------------------------------------------------------------
function renderMonitoringView() {
  var container = document.getElementById('content-container');
  var user = AppState.currentUser;
  var isPI = user.role === 'Investigator';

  // PIs see their own data collection status instead of the full dashboard
  if (isPI) {
    renderDataCollectionView(null);
    return;
  }

  container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);"><i class="fas fa-satellite-dish fa-2x"></i><p style="margin-top:12px;">Loading monitoring data…</p></div>';

  callBackend('apiGetMonitoringDashboard', [], function(res) {
    if (!res || !res.success) {
      container.innerHTML = '<div class="card"><div class="card-body"><p style="color:var(--danger-text);">Failed to load monitoring dashboard.</p></div></div>';
      return;
    }
    var d = res.data;
    var s = d.summary;

    var alertBanner = '';
    if (s.overdue_count > 0 || s.expired_count > 0 || s.expiring_soon_count > 0) {
      alertBanner = '<div style="background:var(--danger-bg);border:1px solid var(--danger-border);border-left:4px solid var(--danger);border-radius:var(--radius-sm);padding:12px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;">' +
        '<i class="fas fa-exclamation-triangle" style="color:var(--danger);font-size:18px;flex-shrink:0;"></i>' +
        '<div style="font-size:13px;color:var(--danger-text);">' +
        (s.overdue_count > 0 ? '<strong>' + s.overdue_count + ' study/studies overdue</strong> for progress report (>60 days). ' : '') +
        (s.expired_count > 0 ? '<strong>' + s.expired_count + ' clearance(s) expired.</strong> ' : '') +
        (s.expiring_soon_count > 0 ? '<strong>' + s.expiring_soon_count + ' clearance(s) expire within 30 days.</strong>' : '') +
        '</div></div>';
    }

    function statCard(icon, color, label, value, view) {
      return '<div class="stat-card" style="cursor:pointer;border-left:4px solid ' + color + ';" onclick="' + (view ? 'navigateTo(\'' + view + '\')' : '') + '">' +
        '<div class="stat-card-header"><span class="stat-label">' + label + '</span><div class="stat-icon" style="color:' + color + ';background:' + color + '22;"><i class="fas ' + icon + '"></i></div></div>' +
        '<div class="stat-value" style="color:' + color + ';">' + value + '</div></div>';
    }

    function studyRow(p, extraBadge) {
      var daysLeft = p.expiry_date ? Math.ceil((new Date(p.expiry_date) - new Date()) / 86400000) : null;
      return '<tr>' +
        '<td><span class="protocol-code" style="font-size:11px;">' + p.protocol_id + '</span></td>' +
        '<td style="font-size:12.5px;max-width:280px;">' + (p.study_title || '') + '</td>' +
        '<td style="font-size:12px;">' + (p.pi_name || '') + '</td>' +
        '<td>' + statusBadge(p.current_status) + (extraBadge || '') + '</td>' +
        '<td style="font-size:11.5px;font-family:\'JetBrains Mono\',monospace;">' + (p.data_collection_start_date || '—') + '</td>' +
        '<td style="font-size:11.5px;">' + (daysLeft !== null ? (daysLeft < 0 ? '<span style="color:var(--danger);font-weight:700;">Expired</span>' : daysLeft < 30 ? '<span style="color:#b45309;font-weight:700;">' + daysLeft + 'd</span>' : daysLeft + 'd') : '—') + '</td>' +
        '<td><button class="btn btn-primary btn-sm" onclick="navigateTo(\'protocol-detail\',\'' + p.protocol_id + '\')"><i class="fas fa-eye"></i> View</button></td>' +
        '</tr>';
    }

    function reportRow(r) {
      var badge = r.aacahb_review_status === 'Reviewed' ? '<span class="badge badge-approved">Reviewed</span>' :
                  r.aacahb_review_status === 'Flagged'   ? '<span class="badge badge-conditions">Flagged</span>' :
                  '<span class="badge badge-submitted">Pending</span>';
      return '<tr>' +
        '<td><span class="protocol-code" style="font-size:11px;">' + r.protocol_id + '</span></td>' +
        '<td style="font-size:12px;">' + r.report_number + '</td>' +
        '<td style="font-size:11.5px;font-family:\'JetBrains Mono\',monospace;">' + (r.report_date||'').substring(0,10) + '</td>' +
        '<td style="font-size:12px;">' + (r.data_collection_status || '—') + '</td>' +
        '<td style="font-size:12px;">' + (r.participants_enrolled_total || 0) + '</td>' +
        '<td>' + badge + '</td>' +
        '<td>' + (r.aacahb_review_status === 'Pending Review'
          ? '<button class="btn btn-accent btn-sm" onclick="showReviewReportModal(\'' + r.report_id + '\',\'' + r.protocol_id + '\',\'' + r.report_number + '\')"><i class="fas fa-check-circle"></i> Review</button>'
          : '<span style="font-size:11px;color:var(--text-muted);">Done</span>') + '</td>' +
        '</tr>';
    }

    var html = '<div class="hero-header" style="background:linear-gradient(135deg,#071224 0%,#0f2744 60%,#1a3a5c 100%);">' +
      '<div><div style="display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,0.2);border:1px solid rgba(16,185,129,0.35);padding:4px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;color:#6ee7b7;margin-bottom:10px;"><i class="fas fa-satellite-dish"></i> Field Monitoring Dashboard</div>' +
      '<h2 style="color:#fff;">Post-Clearance Research Monitoring</h2>' +
      '<p style="color:rgba(255,255,255,0.7);">Track all active data collection, review progress reports, and manage study closeouts.</p></div>' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap;z-index:2;">' +
      '<button class="btn btn-accent btn-sm" onclick="callBackend(\'apiCheckOverdueProgressReports\',[],function(r){showToast((r.data&&r.data.flaggedCount||0)+\' overdue studie(s) checked.\',\'info\');renderMonitoringView();})"><i class="fas fa-bell"></i> Check Overdue</button>' +
      '<button class="btn btn-secondary btn-sm" style="background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.3);" onclick="callBackend(\'apiCheckExpiredClearances\',[],function(r){showToast((r.data&&r.data.expiredCount||0)+\' expiry/ies flagged.\',\'warning\');renderMonitoringView();})"><i class="fas fa-clock"></i> Check Expiries</button>' +
      '</div></div>';

    html += alertBanner;

    // Summary stat cards
    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px;">' +
      statCard('fa-play-circle',   '#10b981', 'Active Studies',     s.active_count,           '') +
      statCard('fa-pause-circle',  '#f59e0b', 'Suspended',          s.suspended_count,        '') +
      statCard('fa-exclamation',   '#ef4444', 'Overdue Reports',    s.overdue_count,          '') +
      statCard('fa-hourglass-end', '#8b5cf6', 'Expiring Soon',      s.expiring_soon_count,    '') +
      statCard('fa-inbox',         '#2563eb', 'Pending Reviews',    s.pending_review_count,   '') +
      statCard('fa-flag-checkered','#10b981', 'Closeout Pending',   s.closeout_pending_count, '') +
      statCard('fa-archive',       '#64748b', 'Archived Studies',   s.archived_count,         '') +
      statCard('fa-times-circle',  '#dc2626', 'Expired Clearances', s.expired_count,          '') +
      '</div>';

    // Pending report reviews
    if (d.pending_reviews && d.pending_reviews.length > 0) {
      html += '<div class="card" style="margin-bottom:20px;">' +
        '<div class="card-header"><div class="card-title"><i class="fas fa-clipboard-check" style="color:var(--accent);"></i> Progress Reports Awaiting Review (' + d.pending_reviews.length + ')</div></div>' +
        '<div class="card-body" style="padding:0;overflow-x:auto;"><table class="data-table"><thead><tr><th>Protocol</th><th>Report</th><th>Submitted</th><th>Status</th><th>Enrolled</th><th>Review Status</th><th>Action</th></tr></thead>' +
        '<tbody>' + d.pending_reviews.map(reportRow).join('') + '</tbody></table></div></div>';
    }

    // Active studies table
    if (d.active_studies && d.active_studies.length > 0) {
      var overdueIds = (d.overdue_studies || []).map(function(p){ return p.protocol_id; });
      html += '<div class="card" style="margin-bottom:20px;">' +
        '<div class="card-header"><div class="card-title"><i class="fas fa-play-circle" style="color:#10b981;"></i> Active Data Collection Studies (' + d.active_studies.length + ')</div></div>' +
        '<div class="card-body" style="padding:0;overflow-x:auto;"><table class="data-table"><thead><tr><th>Protocol</th><th>Study Title</th><th>PI</th><th>Status</th><th>Started</th><th>Clearance Expiry</th><th>Action</th></tr></thead>' +
        '<tbody>' + d.active_studies.map(function(p){
          var overdueBadge = overdueIds.indexOf(p.protocol_id) !== -1
            ? ' <span class="badge" style="background:#dc2626;color:#fff;font-size:9px;">OVERDUE</span>' : '';
          return studyRow(p, overdueBadge);
        }).join('') + '</tbody></table></div></div>';
    }

    // Closeout pending
    if (d.closeout_pending && d.closeout_pending.length > 0) {
      html += '<div class="card" style="margin-bottom:20px;">' +
        '<div class="card-header"><div class="card-title"><i class="fas fa-flag-checkered" style="color:var(--primary-light);"></i> Closeout Reports Awaiting AACAHB Review (' + d.closeout_pending.length + ')</div>' +
        '</div><div class="card-body" style="padding:0;overflow-x:auto;"><table class="data-table"><thead><tr><th>Protocol</th><th>Study Title</th><th>PI</th><th>Status</th><th>Started</th><th>Clearance Expiry</th><th>Action</th></tr></thead>' +
        '<tbody>' + d.closeout_pending.map(function(p){ return studyRow(p, ''); }).join('') + '</tbody></table></div></div>';
    }

    // Recent progress reports
    if (d.recent_reports && d.recent_reports.length > 0) {
      html += '<div class="card">' +
        '<div class="card-header"><div class="card-title"><i class="fas fa-file-alt" style="color:var(--text-muted);"></i> Recent Progress Reports</div></div>' +
        '<div class="card-body" style="padding:0;overflow-x:auto;"><table class="data-table"><thead><tr><th>Protocol</th><th>Report</th><th>Submitted</th><th>DC Status</th><th>Enrolled</th><th>Review Status</th><th>Action</th></tr></thead>' +
        '<tbody>' + d.recent_reports.map(reportRow).join('') + '</tbody></table></div></div>';
    }

    container.innerHTML = html;
  }, function(err) {
    container.innerHTML = '<div class="card"><div class="card-body"><p style="color:var(--danger-text);">Error loading dashboard: ' + err + '</p></div></div>';
  });
}

// Modal: Review a progress report inline
function showReviewReportModal(reportId, protocolId, reportNum) {
  var h = '<div class="modal-overlay active" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal-card" style="max-width:560px;">' +
    '<div class="modal-header"><h3><i class="fas fa-clipboard-check" style="color:var(--accent);margin-right:8px;"></i>Review ' + reportNum + '</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>' +
    '<div class="modal-body">' +
    '<div class="form-section">' +
    '<label class="fld-l">Review Outcome <b class="req">*</b></label>' +
    '<select id="rv-status" class="form-input"><option value="Reviewed">Reviewed — No Issues</option><option value="Flagged">Flagged — Follow-up Required</option><option value="Suspended">Suspend Data Collection</option></select>' +
    '</div>' +
    '<div class="form-section" style="margin-top:14px;">' +
    '<label class="fld-l">Comments to PI</label>' +
    '<textarea id="rv-comments" class="form-input" rows="4" placeholder="Feedback, queries, or directives to the Principal Investigator…"></textarea>' +
    '</div>' +
    '<div id="rv-suspend-warning" style="display:none;margin-top:12px;background:var(--danger-bg);border:1px solid var(--danger-border);border-left:4px solid var(--danger);padding:10px 14px;border-radius:var(--radius-sm);font-size:12.5px;color:var(--danger-text);">' +
    '<i class="fas fa-exclamation-triangle"></i> <strong>Suspend:</strong> This will immediately halt data collection and notify the PI. Only use for serious protocol violations or safety concerns.' +
    '</div>' +
    '</div>' +
    '<div class="modal-footer">' +
    '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" onclick="submitReportReview(\'' + reportId + '\',\'' + protocolId + '\')"><i class="fas fa-check"></i> Submit Review</button>' +
    '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  document.getElementById('rv-status').addEventListener('change', function() {
    document.getElementById('rv-suspend-warning').style.display = this.value === 'Suspended' ? 'block' : 'none';
  });
}

function submitReportReview(reportId, protocolId) {
  var status   = document.getElementById('rv-status').value;
  var comments = document.getElementById('rv-comments').value;
  var suspend  = status === 'Suspended';
  callBackend('apiReviewProgressReport', [reportId, status, comments, suspend], function(res) {
    closeModal();
    showToast('Progress report marked as "' + status + '". The Principal Investigator has been notified of the review outcome.', suspend ? 'warning' : 'success');
    renderMonitoringView();
  }, function(err) { showToast('Review failed: ' + err, 'danger'); });
}

// ----------------------------------------------------------------------------
// DC-2. PI DATA COLLECTION VIEW — Start Gate, Progress History, Declare Complete
// ----------------------------------------------------------------------------
function renderDataCollectionView(protocolId) {
  var container = document.getElementById('content-container');
  var user = AppState.currentUser;

  // If no protocolId given, show the PI's list of approved/active protocols
  if (!protocolId) {
    callBackend('apiGetAllProtocols', [], function(res) {
      var protocols = (res && res.data) ? res.data : (res || []);
      var dcStatuses = ['Approved','Decision Communicated','Final Decision Approved',
                        'Data Collection Active','Data Collection Complete',
                        'Closeout Report Submitted','Closeout Under Review',
                        'Data Collection Suspended','Clearance Expired','Study Archived'];
      var mine = protocols.filter(function(p) {
        return dcStatuses.indexOf(p.current_status) !== -1;
      });
      if (mine.length === 0) {
        container.innerHTML = '<div class="card"><div class="card-body" style="text-align:center;padding:40px;color:var(--text-muted);"><i class="fas fa-satellite-dish fa-2x"></i><p style="margin-top:12px;">No protocols in data collection phase yet.</p></div></div>';
        return;
      }
      var html = '<div class="hero-header" style="background:linear-gradient(135deg,#071224 0%,#0f2744 100%);">' +
        '<div><h2 style="color:#fff;">My Data Collection</h2><p style="color:rgba(255,255,255,0.7);">Manage your active field studies, submit progress reports, and close out completed research.</p></div></div>';
      html += '<div style="display:flex;flex-direction:column;gap:14px;">';
      mine.forEach(function(p) {
        var canStart = p.current_status === 'Approved' || p.current_status === 'Decision Communicated' || p.current_status === 'Final Decision Approved';
        var isActive = p.current_status === 'Data Collection Active';
        var isComplete = p.current_status === 'Data Collection Complete';
        var isSuspended = p.current_status === 'Data Collection Suspended';
        var isCloseout = p.current_status === 'Closeout Report Submitted' || p.current_status === 'Closeout Under Review';
        var isArchived = p.current_status === 'Study Archived';
        var isExpired = p.current_status === 'Clearance Expired';
        html += '<div class="card">' +
          '<div class="card-body" style="padding:20px 24px;">' +
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;">' +
          '<div><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;"><span class="protocol-code">' + p.protocol_id + '</span>' + statusBadge(p.current_status) + '</div>' +
          '<div style="font-weight:700;color:var(--primary);font-size:14px;margin-bottom:4px;">' + (p.study_title||'') + '</div>' +
          (p.study_site ? '<div style="font-size:12px;color:var(--text-muted);"><i class="fas fa-map-marker-alt" style="margin-right:4px;color:var(--primary-light);"></i>' + p.study_site + '</div>' : '') +
          (p.data_collection_start_date ? '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;"><i class="fas fa-calendar-alt" style="margin-right:4px;"></i>Started: ' + p.data_collection_start_date + '</div>' : '') +
          (p.expiry_date ? '<div style="font-size:12px;color:var(--text-muted);margin-top:2px;"><i class="fas fa-hourglass-end" style="margin-right:4px;"></i>Clearance expires: ' + p.expiry_date + '</div>' : '') +
          '</div>' +
          '<div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;">' +
          (canStart ? '<button class="btn btn-success" onclick="showStartCollectionModal(\'' + p.protocol_id + '\')"><i class="fas fa-play-circle"></i> Start Data Collection</button>' : '') +
          (isActive ? '<button class="btn btn-primary" onclick="navigateTo(\'progress-report\',\'' + p.protocol_id + '\')"><i class="fas fa-file-medical"></i> Submit Progress Report</button>' : '') +
          (isActive ? '<button class="btn btn-secondary btn-sm" onclick="confirmDeclareComplete(\'' + p.protocol_id + '\')"><i class="fas fa-flag-checkered"></i> Declare Complete</button>' : '') +
          (isSuspended ? '<div style="font-size:12px;color:var(--danger-text);font-weight:600;"><i class="fas fa-pause-circle"></i> Data collection suspended by AACAHB. Await reinstatement.</div>' : '') +
          (isComplete ? '<button class="btn btn-accent" onclick="navigateTo(\'closeout\',\'' + p.protocol_id + '\')"><i class="fas fa-file-upload"></i> Submit Closeout Report</button>' : '') +
          (isCloseout ? '<div style="font-size:12px;color:var(--primary-light);font-weight:600;"><i class="fas fa-clock"></i> Closeout under AACAHB review.</div>' : '') +
          (isArchived ? '<div style="font-size:12px;color:#10b981;font-weight:600;"><i class="fas fa-archive"></i> Study fully archived.</div>' : '') +
          (isExpired ? '<div style="font-size:12px;color:var(--danger-text);font-weight:600;"><i class="fas fa-exclamation-triangle"></i> Clearance expired. Apply for renewal.</div>' : '') +
          '</div></div></div></div>';
      });
      html += '</div>';
      container.innerHTML = html;
    });
    return;
  }

  // Show progress history for a specific protocol
  callBackend('apiGetProtocolProgressReports', [protocolId], function(res) {
    var reports  = (res && res.data && res.data.reports)  ? res.data.reports  : [];
    var closeout = (res && res.data && res.data.closeout) ? res.data.closeout : null;
    var html = '<div class="card"><div class="card-header"><div class="card-title"><i class="fas fa-history"></i> Progress Reports — ' + protocolId + '</div>' +
      '<button class="btn btn-secondary btn-sm" onclick="navigateTo(\'data-collection\')"><i class="fas fa-arrow-left"></i> Back</button></div>' +
      '<div class="card-body" style="padding:0;overflow-x:auto;">' +
      (reports.length === 0 ? '<p style="padding:24px;text-align:center;color:var(--text-muted);">No progress reports submitted yet.</p>' :
      '<table class="data-table"><thead><tr><th>Report #</th><th>Period</th><th>Sites Visited</th><th>Enrolled (Period)</th><th>Enrolled (Total)</th><th>DC Status</th><th>AE Count</th><th>AACAHB Status</th><th>AACAHB Comments</th></tr></thead><tbody>' +
      reports.map(function(r) {
        var rvBadge = r.aacahb_review_status === 'Reviewed'
          ? '<span class="badge badge-approved">Reviewed</span>'
          : r.aacahb_review_status === 'Flagged'
          ? '<span class="badge badge-conditions">Flagged</span>'
          : '<span class="badge badge-submitted">Pending</span>';
        return '<tr>' +
          '<td><strong>' + r.report_number + '</strong></td>' +
          '<td style="font-size:11.5px;">' + r.reporting_period_start + ' → ' + r.reporting_period_end + '</td>' +
          '<td style="font-size:12px;">' + (r.sites_visited||'—') + '</td>' +
          '<td style="text-align:center;">' + (r.participants_enrolled_this_period||0) + '</td>' +
          '<td style="text-align:center;font-weight:700;">' + (r.participants_enrolled_total||0) + '</td>' +
          '<td>' + (r.data_collection_status||'—') + '</td>' +
          '<td style="text-align:center;' + (r.adverse_events_count > 0 ? 'color:var(--danger);font-weight:700;' : '') + '">' + (r.adverse_events_count||0) + '</td>' +
          '<td>' + rvBadge + '</td>' +
          '<td style="font-size:12px;color:var(--text-muted);">' + (r.aacahb_comments||'—') + '</td>' +
          '</tr>';
      }).join('') + '</tbody></table>') +
      '</div></div>';
    container.innerHTML = html;
  });
}

// Modal: Start Data Collection
function showStartCollectionModal(protocolId) {
  var today = new Date().toISOString().substring(0,10);
  var h = '<div class="modal-overlay active" onclick="if(event.target===this)closeModal()">' +
    '<div class="modal-card" style="max-width:560px;">' +
    '<div class="modal-header"><h3><i class="fas fa-play-circle" style="color:#10b981;margin-right:8px;"></i>Start Data Collection</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>' +
    '<div class="modal-body">' +
    '<div style="background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:16px;font-size:13px;color:var(--text-main);">' +
    '<i class="fas fa-info-circle" style="color:var(--primary-light);margin-right:6px;"></i>' +
    'By starting data collection you confirm that ethical clearance has been granted and you will conduct all research strictly in accordance with the approved protocol.' +
    '</div>' +
    '<div class="form-section"><label class="fld-l">Actual Start Date <b class="req">*</b></label>' +
    '<input type="date" id="dc-start-date" class="form-input" value="' + today + '" max="' + today + '"></div>' +
    '<div class="form-section" style="margin-top:14px;"><label class="fld-l">PI Confirmation Statement <b class="req">*</b></label>' +
    '<textarea id="dc-confirm" class="form-input" rows="3" placeholder="I confirm that I will conduct data collection strictly in accordance with the approved protocol…"></textarea></div>' +
    '</div>' +
    '<div class="modal-footer">' +
    '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-success" onclick="doStartDataCollection(\'' + protocolId + '\')"><i class="fas fa-play-circle"></i> Confirm & Start</button>' +
    '</div></div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
}

function doStartDataCollection(protocolId) {
  var startDate = document.getElementById('dc-start-date').value;
  var confirm_  = document.getElementById('dc-confirm').value.trim();
  if (!confirm_) { showToast('Please provide your confirmation statement.', 'warning'); return; }
  callBackend('apiStartDataCollection', [protocolId, startDate, confirm_], function(res) {
    closeModal();
    showToast('Data collection commenced for ' + protocolId + '.', 'success');
    renderDataCollectionView(null);
  }, function(err) { showToast('Failed: ' + err, 'danger'); });
}

function confirmDeclareComplete(protocolId) {
  if (!confirm('Declare data collection complete for ' + protocolId + '?\n\nYou will then need to submit a Closeout Report with your final research outputs.')) return;
  var endDate = new Date().toISOString().substring(0,10);
  callBackend('apiDeclareDataCollectionComplete', [protocolId, endDate, ''], function(res) {
    showToast('Data collection declared complete. Please submit your Closeout Report.', 'success');
    renderDataCollectionView(null);
  }, function(err) { showToast('Failed: ' + err, 'danger'); });
}

    sites_visited:                    document.getElementById('rp-sites').value.trim(),

    participants_enrolled_this_period:Number(document.getElementById('rp-enrolled-period').value) || 0,
    participants_enrolled_total:      Number(document.getElementById('rp-enrolled-total').value) || 0,
    data_collection_status:           document.getElementById('rp-dc-status').value,
    protocol_deviations:              document.getElementById('rp-deviations').value.trim(),
    adverse_events_count:             Number(document.getElementById('rp-ae-count').value) || 0,
    adverse_events_description:       document.getElementById('rp-ae-desc').value.trim(),

    showToast('Progress report submitted successfully.', 'success');
    navigateTo('data-collection');
  }, function(err) { showToast('Submission failed: ' + err, 'danger'); });
}

var _closeoutFiles = {};
function handleCloseoutFilePick(type, inputEl) {
  var file = inputEl.files && inputEl.files[0];
  if (!file) return;
  _closeoutFiles[type] = file;
  var labelEl = document.getElementById('co-' + type + '-label');
  if (labelEl) labelEl.innerHTML = '<strong style="color:var(--success-text);"><i class="fas fa-check-circle"></i> ' + file.name + '</strong><small>' + (file.size/1024).toFixed(1) + ' KB</small>';
}

function doSubmitCloseout(protocolId) {
  var payload = {
    protocol_id:                  protocolId,
    actual_end_date:              document.getElementById('co-end-date').value,
    total_participants_enrolled:  Number(document.getElementById('co-enrolled').value) || 0,
    study_completion_status:      document.getElementById('co-completion').value,
    summary_of_findings:          document.getElementById('co-findings').value.trim(),
    deviation_from_protocol:      document.getElementById('co-deviations').value.trim(),
    ethical_compliance_statement: document.getElementById('co-compliance').value.trim(),
    research_findings_doc_id:     _closeoutFiles['findings'] ? 'UPLOADED:' + _closeoutFiles['findings'].name : '',
    final_report_doc_id:          _closeoutFiles['findings'] ? 'UPLOADED:' + _closeoutFiles['findings'].name : '',
    dataset_doc_id:               ''
  };
  if (!payload.summary_of_findings || !payload.ethical_compliance_statement) {
    showToast('Summary of findings and compliance statement are required.', 'warning'); return;
  }
  if (!_closeoutFiles['findings']) {
    showToast('Please upload the Research Findings archive (ZIP).', 'warning'); return;
  }
  callBackend('apiSubmitStudyCloseout', [payload], function(res) {
    _closeoutFiles = {};
    showToast('Closeout report submitted. AACAHB will review and archive your study.', 'success');
    navigateTo('data-collection');
  }, function(err) { showToast('Submission failed: ' + err, 'danger'); });
}

            '<td style="text-align:center;' + (r.adverse_events_count > 0 ? 'color:var(--danger);font-weight:700;' : '') + '">' + (r.adverse_events_count||0) + '</td>' +
            '<td>' + rvBadge + '</td>' +
            '<td style="font-size:12px;color:var(--text-muted);">' + (r.aacahb_comments||'—') + '</td></tr>';
        });
        html += '</tbody></table></div>';
      }
      if (closeout) {
        html += '<h5 style="font-family:\'Outfit\',sans-serif;font-size:13px;font-weight:700;color:var(--primary);margin-top:18px;margin-bottom:10px;">Closeout Report</h5>';
        html += '<div style="background:var(--surface-alt);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 18px;font-size:13px;">' +
          '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px 24px;">' +
          '<div><strong>Total Enrolled:</strong> ' + (closeout.total_participants_enrolled||0) + '</div>' +
          '<div><strong>Completion Status:</strong> ' + (closeout.study_completion_status||'—') + '</div>' +
          '<div><strong>Actual End Date:</strong> ' + (closeout.actual_end_date||'—') + '</div>' +
          '<div><strong>AACAHB Status:</strong> ' + (closeout.aacahb_acceptance_status||'Pending') + '</div>' +
          '</div>' +
          '<div style="margin-top:10px;"><strong>Summary of Findings:</strong><p style="margin-top:4px;color:var(--text-muted);font-size:12.5px;">' + (closeout.summary_of_findings||'—') + '</p></div>' +
          '</div>';
      }
    }
    el.innerHTML = html;
  }, function(err) {
    el.innerHTML = '<p style="color:var(--danger-text);font-size:13px;">Failed to load reports: ' + err + '</p>';
  });
}

// INVESTIGATORS DIRECTORY VIEW
// ============================================================================
function renderInvestigatorsView() {
  var container = document.getElementById('content-container');
  var user = AppState.currentUser;
  var isInvestigator = user.role === 'Investigator';

  container.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);"><i class="fas fa-user-graduate fa-2x"></i><p style="margin-top:12px;">Loading investigators…</p></div>';

  callBackend('apiGetInvestigators', [], function(invs) {
    var investigators = (invs && invs.data) ? invs.data : (invs || []);
    var count = investigators.length;

    var html = '<div class="hero-header" style="background:linear-gradient(135deg,#071224 0%,#0f2744 60%,#1a3a5c 100%);">' +
      '<div><div style="display:inline-flex;align-items:center;gap:8px;background:rgba(16,185,129,0.2);border:1px solid rgba(16,185,129,0.35);padding:4px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;color:#6ee7b7;margin-bottom:10px;"><i class="fas fa-user-graduate"></i> Principal Investigators</div>' +
      '<h2 style="color:#fff;">' + (isInvestigator ? 'My Investigator Profile' : 'Registered Principal Investigators') + '</h2>' +
      '<p style="color:rgba(255,255,255,0.7);">' + (isInvestigator ? 'Your registered profile and submitted protocols. You can only view and update your own submissions.' : count + ' investigator(s) registered with AAPHREML-IRERC. Each investigator has access only to their own protocols.') + '</p></div></div>';

    if (count === 0) {
      html += '<div class="card"><div class="card-body" style="text-align:center;padding:40px;color:var(--text-muted);"><i class="fas fa-user-graduate fa-2x"></i><p style="margin-top:12px;">No investigators found.</p></div></div>';
      container.innerHTML = html;
      return;
    }

    html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;margin-top:4px;">';
    investigators.forEach(function(inv) {
      var initials = (inv.full_name || 'I').split(' ').map(function(w){ return w[0]; }).slice(0,2).join('').toUpperCase();
      var statusBadge = inv.is_active ? '<span class="badge badge-approved">Active</span>' : '<span class="badge badge-rejected">Inactive</span>';
      var protos = inv.protocols || [];
      var protoList = protos.length === 0 ? '<p style="font-size:12px;color:var(--text-muted);margin-top:8px;">No protocols submitted yet.</p>' :
        '<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px;">' + protos.map(function(p){
          return '<div style="display:flex;align-items:center;gap:8px;font-size:11.5px;padding:6px 8px;background:var(--surface-alt);border-radius:var(--radius-sm);border-left:3px solid var(--primary-light);cursor:pointer;" onclick="navigateTo(\'protocol-detail\',\'' + p.protocol_id + '\')">' +
            '<i class="fas fa-file-medical" style="color:var(--primary-light);flex-shrink:0;"></i>' +
            '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + (p.study_title||'') + '</span>' +
            statusBadge(p.current_status) + '</div>';
        }).join('') + '</div>';

      html += '<div class="card">' +
        '<div class="card-body" style="padding:20px;">' +
        '<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">' +
          '<div style="width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#0f2744,#2563eb);color:white;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">' + initials + '</div>' +
          '<div style="flex:1;min-width:0;"><div style="font-weight:700;color:var(--primary);font-size:14px;">' + (inv.full_name||'') + '</div>' +
          '<div style="font-size:11.5px;color:var(--text-muted);font-family:\'JetBrains Mono\',monospace;">' + inv.email + '</div>' +
          '<div style="margin-top:2px;">' + statusBadge + ' <span class="badge badge-submitted">' + (inv.protocol_count||0) + ' protocol' + ((inv.protocol_count||0)===1?'':'s') + '</span></div></div></div>' +
        '<div style="font-size:12.5px;line-height:1.7;color:var(--text-main);">' +
          '<div><i class="fas fa-building" style="color:var(--primary-light);width:16px;"></i> <strong>Institution:</strong> ' + (inv.institution_name||'—') + '</div>' +
          '<div><i class="fas fa-sitemap" style="color:var(--primary-light);width:16px;"></i> <strong>Department:</strong> ' + (inv.department||'—') + '</div>' +
          '<div><i class="fas fa-phone" style="color:var(--primary-light);width:16px;"></i> <strong>Telephone:</strong> ' + (inv.telephone||'—') + '</div>' +
          '<div><i class="fas fa-graduation-cap" style="color:var(--primary-light);width:16px;"></i> <strong>Education:</strong> ' + (inv.education_level||'—') + '</div>' +
          '<div><i class="fas fa-calendar-alt" style="color:var(--primary-light);width:16px;"></i> <strong>Registered:</strong> ' + ((inv.registered_date||'').substring(0,10)) + '</div>' +
        '</div>' +
        '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">' +
          '<div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:4px;"><i class="fas fa-folder-open" style="color:var(--accent);margin-right:4px;"></i>Protocols</div>' +
          protoList +
        '</div>' +
        '</div></div>';
    });
    html += '</div>';

    if (!isInvestigator) {
      html += '<div style="margin-top:18px;background:var(--surface-alt);border:1px solid var(--border);border-left:4px solid var(--primary-light);border-radius:var(--radius-sm);padding:12px 18px;font-size:12.5px;color:var(--text-muted);">' +
        '<i class="fas fa-shield-alt" style="color:var(--primary-light);margin-right:6px;"></i><strong>Access Isolation:</strong> Each investigator is restricted to viewing and updating only their own protocol submissions. This is enforced server-side on every API call.</div>';
    }

    container.innerHTML = html;
  }, function(err) {
    container.innerHTML = '<div class="card"><div class="card-body"><p style="color:var(--danger-text);">Failed to load investigators: ' + err + '</p></div></div>';
  });
}

/**
 * Opens a document only when the backend provides a valid Google Drive link.
 */
function viewDocument(fileName, driveUrl, docTitle) {
  var target;
  try {
    target = new URL(String(driveUrl || ''));
  } catch (error) {
    showToast('The document does not have a valid Google Drive link.', 'warning');
    return;
  }
  if (target.protocol !== 'https:' || !['drive.google.com', 'docs.google.com'].includes(target.hostname)) {
    showToast('The document does not have a valid Google Drive link.', 'warning');
    return;
  }
  window.open(target.href, '_blank', 'noopener,noreferrer');
}
